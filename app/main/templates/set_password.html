<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - Inventory Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* --- 1. CORE THEME --- */
        :root {
            --primary-navy: #1e1e2d;       
            --accent-blue: #0d6efd; 
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-bg: rgba(30, 30, 45, 0.85);
            --text-white: #ffffff;
            --text-muted: #cbd5e1;
            /* Alert Colors */
            --alert-error-bg: rgba(220, 53, 69, 0.25);
            --alert-error-border: rgba(220, 53, 69, 0.5);
            --alert-success-bg: rgba(25, 135, 84, 0.25);
            --alert-success-border: rgba(25, 135, 84, 0.5);
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-navy);
            padding: 20px;
        }

        /* --- 2. BACKGROUND & OVERLAY --- */
        .background-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }
        .carousel-item { height: 100vh; }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(30, 30, 45, 0.9) 0%, rgba(13, 110, 253, 0.3) 100%);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        /* --- 3. COMBINED CARD --- */
        .combined-card {
            display: flex;
            width: 100%;
            max-width: 1000px;
            /* Adaptive height */
            min-height: 600px; 
            height: auto;
            
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden;
            z-index: 10;
        }

        /* --- 4. LEFT SIDE: COLLAGE --- */
        .collage-section {
            width: 50%;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            align-self: stretch;
        }
        .collage-img {
            width: 100%; height: 100%; object-fit: cover;
            transition: 0.3s ease; filter: brightness(0.85);
        }
        .collage-img:hover { filter: brightness(1); transform: scale(1.05); z-index: 2; }

        /* --- 5. RIGHT SIDE: FORM --- */
        .form-section {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: var(--text-white);
        }

        /* --- LOGO INSIDE --- */
        .floating-logo {
            position: relative;
            width: 90px; height: 90px;
            margin: 0 auto 15px auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            padding: 12px;
        }
        .floating-logo img { width: 140%; height: auto; object-fit: contain; }

        .brand-title { text-align: center; font-weight: 700; font-size: 1.2rem; margin-bottom: 5px; }
        .brand-subtitle { 
            text-align: center; font-size: 0.8rem; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 25px; 
        }

        /* --- INPUTS --- */
        .custom-input-group {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 10px 15px; margin-bottom: 20px;
            display: flex; align-items: center; transition: 0.3s;
        }
        .custom-input-group:focus-within {
            border-color: var(--accent-blue); background: rgba(0, 0, 0, 0.4);
        }
        .custom-input-group input {
            background: transparent; border: none; outline: none;
            color: white; width: 100%; font-size: 0.95rem;
        }
        .custom-input-group input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .input-icon { color: var(--text-muted); font-size: 1.1rem; margin-left: 10px; }

        /* Specific style for Read-Only Email */
        .readonly-input {
            background: rgba(0, 0, 0, 0.5); /* Darker background */
            border-color: rgba(255,255,255,0.05);
            cursor: not-allowed;
        }
        .readonly-input input {
            color: #adb5bd; /* Muted text color */
        }

        /* --- GLASS ALERTS --- */
        .custom-alert {
            background: var(--alert-error-bg);
            border: 1px solid var(--alert-error-border);
            color: #ffdae0;
            font-size: 0.85rem;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .custom-alert.alert-success {
            background: var(--alert-success-bg);
            border-color: var(--alert-success-border);
            color: #d1e7dd;
        }
        .btn-close-white-custom {
            filter: invert(1) grayscale(100%) brightness(200%); opacity: 0.8;
        }

        /* --- BUTTONS --- */
        .btn-submit {
            background-color: var(--accent-blue); color: white; border: none;
            border-radius: 8px; padding: 12px; font-weight: 600; width: 100%;
            transition: 0.3s; margin-top: 5px;
        }
        .btn-submit:hover { background-color: #0b5ed7; }

        .return-link {
            text-align: center; margin-top: 15px; font-size: 0.9rem;
        }
        .return-link a { color: var(--text-muted); text-decoration: none; transition: 0.2s; }
        .return-link a:hover { color: white; text-decoration: underline; }

        @media (max-width: 991px) {
            .combined-card { flex-direction: column; min-height: auto; max-width: 450px; }
            .collage-section { display: none; }
            .form-section { width: 100%; padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <div class="background-wrapper">
        <div id="setPassCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="4000">
            <div class="carousel-inner">
                <div class="carousel-item active"><img src="{{ url_for('static', filename='images/bg2.jpg') }}"></div>
                <div class="carousel-item"><img src="{{ url_for('static', filename='images/bg1.jpg') }}"></div>
            </div>
        </div>
    </div>
    <div class="bg-overlay"></div>

    <!-- MAIN CARD -->
    <div class="combined-card">
        
        <!-- LEFT: COLLAGE -->
        <div class="collage-section">
            <img src="{{ url_for('static', filename='images/bg1.jpg') }}" class="collage-img">
            <img src="{{ url_for('static', filename='images/bg2.jpg') }}" class="collage-img">
            <img src="{{ url_for('static', filename='images/bg2.jpg') }}" class="collage-img">
            <img src="{{ url_for('static', filename='images/bg1.jpg') }}" class="collage-img">
        </div>

        <!-- RIGHT: FORM -->
        <div class="form-section">
            
            <div class="floating-logo">
                <img src="{{ url_for('static', filename='images/logo2.png') }}" alt="Logo">
            </div>

            <div class="brand-title">Padre Garcia Polytechnic College</div>
            <div class="brand-subtitle">Finalize Setup</div>

            <!-- GLASS FLASH MESSAGES -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert custom-alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                            <span>{{ message }}</span>
                            <button type="button" class="btn-close btn-close-white-custom" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div style="text-align:center; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 20px;">
                Finalize your Google account setup.
            </div>

            <form method="POST" action="{{ url_for('google_auth.set_password_post') }}">
                
                <!-- Read Only Email -->
                <div class="custom-input-group readonly-input">
                    <input type="text" id="email" name="email" value="{{ email }}" readonly>
                    <i class="bi bi-envelope input-icon"></i>
                </div>

                <!-- Create Password -->
                <div class="custom-input-group">
                    <input type="password" id="password" name="password" placeholder="Create Password" required>
                    <i class="bi bi-shield-lock input-icon"></i>
                </div>

                <!-- Confirm Password -->
                <div class="custom-input-group">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                    <i class="bi bi-shield-check input-icon"></i>
                </div>

                <button type="submit" class="btn-submit">
                    Save Password & Login
                </button>

                <div class="return-link">
                    <a href="{{ url_for('main.login') }}">Return to Login</a>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
