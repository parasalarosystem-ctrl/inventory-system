<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Inventory Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* --- 1. CORE THEME --- */
        :root {
            --primary-navy: #1e1e2d;       
            --accent-blue: #0d6efd; 
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-bg: rgba(30, 30, 45, 0.85);
            --text-white: #ffffff;
            --text-muted: #cbd5e1;
            /* Alert Colors */
            --alert-error-bg: rgba(220, 53, 69, 0.25);
            --alert-error-border: rgba(220, 53, 69, 0.5);
            --alert-success-bg: rgba(25, 135, 84, 0.25);
            --alert-success-border: rgba(25, 135, 84, 0.5);
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-navy);
            padding: 20px;
        }

        /* --- 2. BACKGROUND & OVERLAY --- */
        .background-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }
        .carousel-item { height: 100vh; }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(30, 30, 45, 0.9) 0%, rgba(13, 110, 253, 0.3) 100%);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        /* --- 3. COMBINED CARD --- */
        .combined-card {
            display: flex;
            width: 100%;
            max-width: 1000px;
            /* Auto height allows expansion if alerts appear */
            min-height: 600px; 
            height: auto;
            
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden;
            z-index: 10;
        }

        /* --- 4. LEFT SIDE: SINGLE IMAGE PANEL --- */
        .collage-section {
            width: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: stretch;
            background: rgba(0,0,0,0.35);
            overflow: hidden;
        }
        .collage-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(13,110,253,0.12) 0%, rgba(0,0,0,0.35) 100%);
            z-index: 1;
        }
        .collage-img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center;
            display: block; position: relative; z-index: 2;
        }

        /* --- 5. RIGHT SIDE: FORM --- */
        .form-section {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: var(--text-white);
        }

        /* --- LOGO INSIDE --- */
        .floating-logo {
            width: 100px; height: 100px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.35);
            flex-shrink: 0;
        }
        .floating-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

        .brand-title { text-align: center; font-weight: 700; font-size: 1.2rem; margin-bottom: 5px; }
        .brand-subtitle { 
            text-align: center; font-size: 0.8rem; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 25px; 
        }

        /* --- INPUTS --- */
        .custom-input-group {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 10px 15px; margin-bottom: 20px;
            display: flex; align-items: center; transition: 0.3s;
        }
        .custom-input-group:focus-within {
            border-color: var(--accent-blue); background: rgba(0, 0, 0, 0.4);
        }
        .custom-input-group input {
            background: transparent; border: none; outline: none;
            color: white; width: 100%; font-size: 0.95rem;
        }
        .custom-input-group input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .input-icon { color: var(--text-muted); font-size: 1.1rem; margin-left: 10px; }

        /* --- GLASS ALERTS --- */
        .custom-alert {
            background: var(--alert-error-bg);
            border: 1px solid var(--alert-error-border);
            color: #ffdae0;
            font-size: 0.85rem;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .custom-alert.alert-success {
            background: var(--alert-success-bg);
            border-color: var(--alert-success-border);
            color: #d1e7dd;
        }
        .btn-close-white-custom {
            filter: invert(1) grayscale(100%) brightness(200%); opacity: 0.8;
        }

        /* --- BUTTONS --- */
        .btn-submit {
            background-color: var(--accent-blue); color: white; border: none;
            border-radius: 8px; padding: 12px; font-weight: 600; width: 100%;
            transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #0b5ed7; }

        @media (max-width: 991px) {
            .combined-card { flex-direction: column; min-height: auto; max-width: 450px; }
            .collage-section { display: none; }
            .form-section { width: 100%; padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <div class="background-wrapper">
        <div id="resetCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="4000">
            <div class="carousel-inner">
                <div class="carousel-item active"><img src="{{ url_for('static', filename='images/convenience_logo.png') }}"></div>
            </div>
        </div>
    </div>
    <div class="bg-overlay"></div>

    <!-- MAIN CARD -->
    <div class="combined-card">
        
        <!-- LEFT: SINGLE LOGO PANEL -->
        <div class="collage-section">
            <img src="{{ url_for('static', filename='images/convenience_logo.png') }}" class="collage-img" alt="Convenient Store">
        </div>

        <!-- RIGHT: FORM -->
        <div class="form-section">
            
            <div class="floating-logo">
                <img src="{{ url_for('static', filename='images/convenience_logo.png') }}" alt="Logo">
            </div>

            <div class="brand-title">Convenient Store</div>
            <div class="brand-subtitle">Security Check</div>

            <!-- GLASS FLASH MESSAGES -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert custom-alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                            <span>{{ message }}</span>
                            <button type="button" class="btn-close btn-close-white-custom" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div style="text-align:center; color: #cbd5e1; font-size: 0.9rem; margin-bottom: 20px;">
                Please create a new, strong password for your account.
            </div>

            <form method="POST" action="{{ url_for('main.reset_password', token=token) }}" onsubmit="return validatePasswords()">
                
                <div class="custom-input-group">
                    <input type="password" name="password" id="newPassword" placeholder="New Password (min. 8 chars)" required minlength="8">
                    <i class="bi bi-lock input-icon"></i>
                </div>

                <div class="custom-input-group" id="confirmGroup">
                    <input type="password" name="confirm_password" id="confirmPassword" placeholder="Confirm New Password" required>
                    <i class="bi bi-shield-check input-icon"></i>
                </div>
                <div id="matchError" style="color:#f87171; font-size:0.8rem; margin-top:-14px; margin-bottom:12px; display:none;">
                    <i class="bi bi-exclamation-circle"></i> Passwords do not match.
                </div>

                <button type="submit" class="btn-submit">
                    Update Password
                </button>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function validatePasswords() {
            const pw  = document.getElementById('newPassword').value;
            const cpw = document.getElementById('confirmPassword').value;
            const err = document.getElementById('matchError');
            const grp = document.getElementById('confirmGroup');
            if (pw !== cpw) {
                err.style.display = 'block';
                grp.style.borderColor = 'rgba(220,53,69,0.6)';
                return false;
            }
            if (pw.length < 8) {
                err.textContent = ' Password must be at least 8 characters.';
                err.style.display = 'block';
                return false;
            }
            return true;
        }
        document.getElementById('confirmPassword').addEventListener('input', function() {
            document.getElementById('matchError').style.display = 'none';
            document.getElementById('confirmGroup').style.borderColor = '';
        });
    </script>

</body>
</html>
