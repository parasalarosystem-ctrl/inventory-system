<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory Management System</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* --- 1. CORE THEME --- */
        :root {
            --primary-navy: #1e1e2d;       
            --accent-blue: #0d6efd; 
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-bg: rgba(30, 30, 45, 0.85);
            --text-white: #ffffff;
            --text-muted: #cbd5e1;
            /* Alert Colors */
            --alert-error-bg: rgba(220, 53, 69, 0.25);
            --alert-error-border: rgba(220, 53, 69, 0.5);
            --alert-success-bg: rgba(25, 135, 84, 0.25);
            --alert-success-border: rgba(25, 135, 84, 0.5);
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            min-height: 100vh; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-navy);
            padding: 20px; 
        }

        /* --- 2. BACKGROUND & OVERLAY --- */
        .background-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }
        .carousel-item { height: 100vh; }
        .carousel-item img { width: 100%; height: 100%; object-fit: cover; }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(30, 30, 45, 0.9) 0%, rgba(13, 110, 253, 0.3) 100%);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        /* --- 3. MAIN CARD --- */
        .combined-card {
            display: flex;
            width: 100%;
            max-width: 1000px;
            min-height: 550px; 
            height: auto;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            overflow: hidden; 
            z-index: 10;
        }

        /* --- 4. LEFT SIDE: SINGLE IMAGE PANEL --- */
        .collage-section {
            width: 55%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: stretch;
            background: rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }
        .collage-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(13,110,253,0.12) 0%, rgba(0,0,0,0.35) 100%);
            z-index: 1;
        }
        .collage-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            position: relative;
            z-index: 2;
        }

        /* --- 5. RIGHT SIDE: FORM --- */
        .form-section {
            width: 45%;
            padding: 40px;
            padding-top: 30px; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            color: var(--text-white);
        }

        /* --- LOGO INSIDE --- */
        .floating-logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            flex-shrink: 0;
        }
        .floating-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .brand-title { text-align: center; font-weight: 700; font-size: 1.3rem; margin-bottom: 5px; }
        .brand-subtitle { 
            text-align: center; font-size: 0.8rem; color: var(--text-muted);
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; 
        }

        /* --- INPUTS --- */
        .custom-input-group {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 8px; padding: 12px 15px; margin-bottom: 20px;
            display: flex; align-items: center; transition: 0.3s;
        }
        .custom-input-group:focus-within {
            border-color: var(--accent-blue); background: rgba(0, 0, 0, 0.4);
        }
        .custom-input-group input {
            background: transparent; border: none; outline: none;
            color: white; width: 100%; font-size: 1rem;
        }
        .custom-input-group input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .input-icon { color: var(--text-muted); font-size: 1.2rem; margin-left: 10px; }
        .input-icon:hover { color: var(--accent-blue); }

        /* --- ALERTS --- */
        .custom-alert {
            background: var(--alert-error-bg);
            border: 1px solid var(--alert-error-border);
            color: #ffdae0;
            font-size: 0.85rem;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .custom-alert.alert-success {
            background: var(--alert-success-bg);
            border-color: var(--alert-success-border);
            color: #d1e7dd;
        }
        .btn-close-white-custom {
            filter: invert(1) grayscale(100%) brightness(200%);
            opacity: 0.8;
        }

        /* --- BUTTONS --- */
        .btn-login {
            background-color: var(--accent-blue); color: white; border: none;
            border-radius: 8px; padding: 12px; font-weight: 600; width: 100%;
            transition: 0.3s; margin-bottom: 15px; cursor: pointer;
        }
        .btn-login:hover { background-color: #0b5ed7; }

        .forgot-link {
            float: right; font-size: 0.8rem; color: var(--text-muted); text-decoration: none;
            margin-top: -10px; margin-bottom: 25px;
        }
        .signup-link {
            text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);
        }
        .signup-link a { color: var(--accent-blue); text-decoration: none; font-weight: 600; }

        @media (max-width: 991px) {
            .combined-card { flex-direction: column; min-height: auto; max-width: 450px; }
            .collage-section { display: none; }
            .form-section { width: 100%; padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- BACKGROUND -->
    <div class="background-wrapper">
        <div id="loginCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-inner">
                <div class="carousel-item active"><img src="{{ url_for('static', filename='images/convenience_logo.png') }}"></div>
            </div>
        </div>
    </div>
    <div class="bg-overlay"></div>

    <!-- CARD -->
    <div class="combined-card">
        
        <!-- LEFT: SINGLE LOGO PANEL -->
        <div class="collage-section">
            <img src="{{ url_for('static', filename='images/convenience_logo.png') }}" class="collage-img" alt="Convenient Store Logo">
        </div>

        <!-- RIGHT: FORM -->
        <div class="form-section">
            
            <div class="floating-logo">
                <img src="{{ url_for('static', filename='images/convenience_logo.png') }}" alt="Convenient Store Logo">
            </div>

            <div class="brand-title">Convenience Store</div>
            <div class="brand-subtitle">Inventory Management System</div>

            <!-- FIXED FLASH MESSAGES -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert custom-alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                            <span>{{ message }}</span>
                            <button type="button" class="btn-close btn-close-white-custom" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('main.login') }}" id="loginForm">
                
                <!-- Gmail/Email -->
                <div class="custom-input-group">
                    <input type="text" id="username" name="username" placeholder="Enter Gmail/Email" required>
                    <i class="bi bi-envelope input-icon"></i>
                </div>

                <!-- Password with View Toggle -->
                <div class="custom-input-group">
                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                    <i class="bi bi-eye-slash input-icon" id="togglePassword" style="cursor: pointer;" title="Show/Hide Password"></i>
                </div>

                <!-- CAPTCHA Input -->
                <div class="custom-input-group">
                    <input type="text" id="captcha" name="captcha" placeholder="Enter CAPTCHA" required>
                    <i class="bi bi-shield-check input-icon"></i>
                </div>
                
                <!-- CAPTCHA Display -->
                <div style="background: rgba(255,255,255,0.95); border-radius: 8px; padding: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span id="captchaText" style="font-size: 1.8rem; font-weight: 700; letter-spacing: 8px; color: #1e1e2d; font-family: 'Courier New', monospace; text-decoration: line-through; text-decoration-color: rgba(0,0,0,0.3);">LOADING</span>
                        <button type="button" onclick="generateCaptcha()" style="background: none; border: none; cursor: pointer; color: #0d6efd; font-size: 1.2rem;" title="Refresh CAPTCHA">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>

                <a href="{{ url_for('main.forgot_password') }}" class="forgot-link">Forgot Password?</a>
                <div style="clear:both;"></div>

                <button type="submit" class="btn-login">
                    Sign In
                </button>

            </form>

            <script>
                // Generate random CAPTCHA on page load
                function generateCaptcha() {
                    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
                    let captcha = '';
                    for (let i = 0; i < 6; i++) {
                        captcha += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    document.getElementById('captchaText').textContent = captcha;
                    document.getElementById('captchaText').dataset.value = captcha;
                }

                // Generate CAPTCHA when page loads
                window.addEventListener('DOMContentLoaded', function() {
                    generateCaptcha();
                });

                // Toggle password visibility
                const togglePassword = document.getElementById('togglePassword');
                const passwordInput = document.getElementById('password');

                togglePassword.addEventListener('click', function() {
                    // Toggle the type attribute
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    // Toggle the icon
                    this.classList.toggle('bi-eye');
                    this.classList.toggle('bi-eye-slash');
                });

                // Validate CAPTCHA on form submit
                document.getElementById('loginForm').addEventListener('submit', function(e) {
                    const userCaptcha = document.getElementById('captcha').value;
                    const actualCaptcha = document.getElementById('captchaText').dataset.value;
                    
                    if (userCaptcha !== actualCaptcha) {
                        e.preventDefault();
                        alert('❌ CAPTCHA is incorrect. Please try again.');
                        generateCaptcha();
                        document.getElementById('captcha').value = '';
                        document.getElementById('captcha').focus();
                        return false;
                    }
                });
            </script>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
